<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="556" viewBox="0 0 1032 556" role="img" aria-labelledby="title description"><title id="title">Why Agency compares departures with the timetable</title><desc id="description">Three synthetic City X cases: a ten-minute interval that matches the timetable, a twenty-minute interval instead of ten, and an unknown interval because the middle trip does not report.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#edf0ed}.eyebrow{font-size:11px;letter-spacing:2px;fill:#b5c568}.title{font-size:18px;font-weight:600}.label{font-size:12px;fill:#a3adb4}.value{font-size:30px;font-weight:500}.accent{fill:#c2d17f}</style><rect width="1032" height="556" rx="20" fill="#101418"/><text x="30" y="38" class="eyebrow">VIGO AGENCY · CITY X</text><text x="30" y="78" font-size="29" font-weight="600">A gap between reports is not enough.</text><text x="30" y="108" class="label">Compare the same scheduled departures at the same stop. Keep missing evidence visible.</text><g transform="translate(30,140)"><rect width="306" height="327" rx="15" fill="#171c20" stroke="#30373e"/><text x="20" y="34" class="eyebrow">01</text><text x="20" y="66" class="title">Matches the timetable</text><text x="20" y="105" class="label">Scheduled interval</text><rect x="20" y="117" width="100" height="7" rx="3" fill="#58636b"/><text x="20" y="151" class="value">10 min</text><text x="20" y="194" class="label">Predicted interval</text><rect x="20" y="206" width="100" height="7" rx="3" fill="#b5c568"/><text x="20" y="240" class="value accent">10 min</text><text x="20" y="289" class="label">3 of 3 trips reporting</text></g><g transform="translate(354,140)"><rect width="306" height="327" rx="15" fill="#171c20" stroke="#30373e"/><text x="20" y="34" class="eyebrow">02</text><text x="20" y="66" class="title">A wider interval</text><text x="20" y="105" class="label">Scheduled interval</text><rect x="20" y="117" width="100" height="7" rx="3" fill="#58636b"/><text x="20" y="151" class="value">10 min</text><text x="20" y="194" class="label">Predicted interval</text><rect x="20" y="206" width="200" height="7" rx="3" fill="#b5c568"/><text x="20" y="240" class="value accent">20 min</text><text x="20" y="289" class="label">2 of 2 departures in this pair report</text></g><g transform="translate(678,140)"><rect width="306" height="327" rx="15" fill="#171c20" stroke="#30373e"/><text x="20" y="34" class="eyebrow">03</text><text x="20" y="66" class="title">An unanswered question</text><text x="20" y="105" class="label">Scheduled interval</text><rect x="20" y="117" width="200" height="7" rx="3" fill="#58636b"/><text x="20" y="151" class="value">20 min</text><text x="20" y="194" class="label">Comparable departure interval</text><path d="M20 210 H220" stroke="#58636b" stroke-dasharray="5 6"/><text x="20" y="243" class="value">Unknown</text><text x="20" y="289" class="label">The middle departure is missing</text></g><text x="30" y="505" class="label">Synthetic example · Values computed by the same departure-comparison code used in Live.</text><text x="30" y="530" class="label">These are predictions, not observed vehicle passages or proof of route-wide reliability.</text></svg>