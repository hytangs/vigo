name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install mypy pytest ruff tqdm
      - name: Check code
        run: python -m ruff check vigo tests scripts
      - name: Check types
        run: python -m mypy vigo
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Check accelerated decoding
        run: |
          python -m pip install ".[speed]"
          python -m pytest -q
      - name: Check documentation
        run: python scripts/build-docs.py --check
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public source
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed wheel
        run: python scripts/check-wheel.py dist

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    steps:
      - name: Require a pinned engine commit for release wheels
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ENGINE_REF: ${{ vars.VIGO_ENGINE_REF }}
        run: test "${#ENGINE_REF}" -eq 40 && [[ "$ENGINE_REF" =~ ^[0-9a-fA-F]+$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hytangs/vigo
          ref: ${{ vars.VIGO_ENGINE_REF || 'main' }}
          path: engine
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: engine/.nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install ".[progress,speed]" pytest
      - run: npm ci --ignore-scripts
        working-directory: engine
      - run: npm run build:rust-routing-kernel
        working-directory: engine
      - run: npm run build:cli
        working-directory: engine
      - run: python scripts/prepare-runtime.py --engine engine
      - name: Prepare public fixture
        working-directory: engine
        run: node ../scripts/prepare-integration.mjs
      - name: Build self-contained platform wheel
        env:
          VIGO_BUNDLE_RUNTIME: build/headless
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test headless engine including optional progress
        env:
          VIGO_RUNTIME: build/headless
        run: python -m pytest tests/test_live_runtime.py -q
      - name: Verify isolated wheel with no Node on PATH
        run: python scripts/check-wheel.py dist --require-bundled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [test, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: python -m twine check dist/*
      - name: Publish verified wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "VIGO Python ${{ github.ref_name }}" --notes-file docs/releases/0.5.1.md
