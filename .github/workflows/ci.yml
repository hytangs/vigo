name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  container:
    uses: ./.github/workflows/deployment-check.yml

  source-and-native-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:security
      - run: npm run check:package-publication
      - run: npm run check:rust-routing-targets
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: npm run check:rust-workspace
      - run: cargo test --manifest-path native/Cargo.toml
      - run: cargo clippy --release --all-targets --manifest-path native/Cargo.toml -- -D warnings
      - run: cargo test --no-default-features --features standalone --manifest-path native/Cargo.toml
      - run: cargo clippy --all-targets --no-default-features --features standalone --manifest-path native/Cargo.toml -- -D warnings

  engine:
    name: Complete engine (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - name: Install pinned Electron runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 2
          done
          exit 1
      - run: npm run build
      - run: xvfb-run -a npm run check:studio-runtime
        if: runner.os == 'Linux'
      - run: npm run check:studio-runtime
        if: runner.os != 'Linux'
      - run: npm run check:corpus
      - run: npm run check:standalone
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run package:cli
      - run: npm run check:cli-package
      - run: node test/check-city-portability.mjs --write temp/portable-city.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: city-${{ matrix.os }}
          path: temp/portable-city.zip
          if-no-files-found: error

  city-portability:
    needs: engine
    name: Foreign City reuse (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:rust-routing-kernel
      - run: npm run build:cli
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: city-*
          path: temp/foreign-cities
      - run: node test/check-city-portability.mjs --read temp/foreign-cities
