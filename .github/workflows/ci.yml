name: CI

on:
  push:
    branches: [main, vigo-v1-final]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  source-and-native-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: npm audit --audit-level=high
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:security
      - run: npm run check:package-publication
      - run: npm run check:rust-routing-targets
      - run: npm run check:rust-workspace
      - run: cargo test --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml
      - run: cargo clippy --all-targets --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml -- -D warnings

  engine:
    name: Complete engine (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: npm run build:cli-runtime
      - name: Reuse this job's compiled runtime
        run: echo "VIGO_USE_BUILT_RUNTIME=1" >> "$GITHUB_ENV"
        shell: bash
      - run: npm run check:release
      - name: Install pinned Electron runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 2
          done
          exit 1
      - run: npm run build:studio-assets
      - run: xvfb-run -a npm run check:studio-runtime
        if: runner.os == 'Linux'
      - run: npm run check:studio-runtime
        if: runner.os != 'Linux'
      - run: npm run check:corpus
      - run: npm run check:standalone
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run package:cli
      - run: npm run check:cli-package
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install './python[progress,speed]' pytest
      - run: node python/scripts/prepare-integration.mjs
      - name: Check Python against the already built engine
        run: python -m pytest python/tests/test_live_runtime.py -q
        env:
          VIGO_RUNTIME: ${{ github.workspace }}/public/vigo.mjs
