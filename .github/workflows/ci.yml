name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Called by Release, which runs the engine checks on every platform itself.
        type: boolean
        default: false

concurrency:
  # A PR must not cancel the push run for its own head commit.
  group: ${{ github.workflow }}-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  source:
    name: Source, dependencies and Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: npm run format:check
      - run: npm run check:package-publication
      - run: npm run check:docs
      - run: npm run check:rust-workspace
      - uses: ./.github/actions/save-rust-cache
      - run: cargo clippy --all-targets --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml -- -D warnings

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - { os: macos-15, python-version: '3.12' }
          - { os: windows-2022, python-version: '3.12' }
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned so a new linter release cannot fail an unchanged release.
      - run: python -m pip install mypy==2.4.1 pytest ruff==0.17.4 tqdm
      - run: python -m ruff check vigo tests scripts examples
      - run: python -m mypy vigo
      - run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check accelerated decoding
        run: |
          python -m pip install ".[speed]"
          python -m pytest -q
      - run: python scripts/build-docs.py --check
      - run: python scripts/check-notebooks.py
      - run: python scripts/check-public-release.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/check-wheel.py dist

  engine:
    name: Engine, compiler, Studio and Python live
    if: ${{ !inputs.release }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build:cli-runtime
      - uses: ./.github/actions/save-rust-cache
      - run: |
          echo "VIGO_USE_BUILT_RUNTIME=1" >> "$GITHUB_ENV"
          node scripts/install-electron.mjs
      - run: cargo test --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml
      - run: xvfb-run -a npm run check:release
      - run: npm run build:studio-assets
      - run: xvfb-run -a npm run check:studio-runtime
      - run: npm run check:corpus
      - run: npm run check:standalone
      - run: npm run package:cli
      - run: npm run check:cli-package
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install './python[progress,speed]' pytest
      - run: node python/scripts/prepare-integration.mjs
      - name: Check Python against the built engine
        run: python -m pytest python/tests/test_live_runtime.py -q
        env:
          VIGO_RUNTIME: ${{ github.workspace }}/public/vigo.mjs
