name: Release package verification

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cargo test --manifest-path native/vigo-routing-kernel/Cargo.toml
      - run: cargo clippy --release --all-targets --all-features --target aarch64-apple-darwin --manifest-path native/vigo-routing-kernel/Cargo.toml -- -D warnings
      - run: npm run release:macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigo-macos-arm64
          path: |
            release/VIGO-*-mac-arm64.zip
            release/VIGO-*-mac-arm64.zip.sha256
          if-no-files-found: error

  attest-macos-arm64:
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vigo-macos-arm64
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/VIGO-*-mac-arm64.zip
