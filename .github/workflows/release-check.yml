name: Release package verification

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    uses: ./.github/workflows/deployment-check.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: cargo test --manifest-path native/vigo-routing-kernel/Cargo.toml
      - run: cargo clippy --release --all-targets --manifest-path native/vigo-routing-kernel/Cargo.toml -- -D warnings
      - run: cargo test --no-default-features --features standalone --manifest-path native/vigo-routing-kernel/Cargo.toml
      - run: cargo clippy --all-targets --no-default-features --features standalone --manifest-path native/vigo-routing-kernel/Cargo.toml -- -D warnings
      - run: npm run check:standalone
      - run: python test/check-package-publication.py
      - name: Package and verify standalone Rust
        run: python scripts/package-standalone.py
      - run: python test/check-standalone-package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-${{ matrix.os }}
          path: |
            release/rust/*.tar.gz
            release/rust/*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
      - run: xvfb-run -a npm run check:studio-runtime
        if: runner.os == 'Linux'
      - run: npm run check:studio-runtime
        if: runner.os != 'Linux'
      - name: Build and archive CLI only
        id: cli
        run: npm run package:cli
      - run: npm run check:cli-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-${{ matrix.os }}
          path: |
            ${{ steps.cli.outputs.archive-path }}
            ${{ steps.cli.outputs.archive-path }}.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Build, verify, and archive Studio
        id: package
        run: npm run release:studio
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-${{ matrix.os }}
          path: ${{ steps.package.outputs.archive-path }}
          compression-level: 0
          if-no-files-found: error

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
      - run: npm run check:docs
      - run: python3 scripts/build-standalone-docs.py --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation
          path: |
            docs/guide.html
            docs/standalone.html
            docs/standalone-openapi.json
          if-no-files-found: error

  attest:
    needs: [build, docs, deployment]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: release
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/*

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: release
          merge-multiple: true
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "VIGO Studio ${{ github.ref_name }}" --generate-notes
