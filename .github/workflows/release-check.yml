name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified revision-named assets to the release
        type: boolean
        default: false
      release_tag:
        description: Existing release tag matching package.json (original assets are preserved)
        type: string
        default: v1.0.0-rc.2

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  python-quality:
    # GitHub validates permissions of the nested publisher even when skipped.
    # The called quality jobs retain their workflow-level contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/python.yml

  deployment:
    needs: build
    uses: ./.github/workflows/deployment-check.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: npm run build:cli-runtime
      - name: Cache the compiled runtime before validation
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Reuse this job's compiled runtime
        shell: bash
        run: echo "VIGO_USE_BUILT_RUNTIME=1" >> "$GITHUB_ENV"
      - run: npm run check:release
      - run: npm run check:rust-workspace
        if: matrix.os == 'ubuntu-24.04'
      - run: cargo test --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml
      # Lints do not depend on the host; one platform is enough.
      - run: cargo clippy --all-targets --no-default-features --features standalone --manifest-path crates/vigo-runtime/Cargo.toml -- -D warnings
        if: matrix.os == 'ubuntu-24.04'
      - run: npm run check:corpus
      - run: npm run check:standalone
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python test/check-package-publication.py
      - name: Package and verify standalone Rust
        run: python scripts/package-standalone.py
      - run: python test/check-standalone-package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rust-${{ matrix.os }}
          path: |
            release/rust/*.tar.gz
            release/rust/*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Install pinned Electron runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            node node_modules/electron/install.js && exit 0
            sleep 2
          done
          exit 1
      - run: npm run build:studio-assets
      - run: xvfb-run -a npm run check:studio-runtime
        if: runner.os == 'Linux'
      - run: npm run check:studio-runtime
        if: runner.os != 'Linux'
      - name: Build and archive CLI only
        id: cli
        run: npm run package:cli
      - run: npm run check:cli-package
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install './python[progress,speed]' pytest
      - run: node python/scripts/prepare-integration.mjs
      - name: Stage Python bundle from this job's compiled engine
        working-directory: python
        run: python scripts/prepare-runtime.py --engine ..
      - name: Build Python platform wheel
        working-directory: python
        env:
          VIGO_BUNDLE_RUNTIME: build/headless
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed Python wheel without host Node
        working-directory: python
        run: python scripts/check-wheel.py dist --require-bundled --require-live
      - name: Verify release identity and archive Python wheel
        working-directory: python
        run: python scripts/package-release.py --engine .. --wheels dist --output ../release/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python-${{ matrix.os }}
          path: |
            release/python/*.zip
            release/python/*.sha256
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli-${{ matrix.os }}
          path: |
            ${{ steps.cli.outputs.archive-path }}
            ${{ steps.cli.outputs.archive-path }}.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Build, verify, and archive Studio
        id: package
        run: npm run check:icons && npm run package:studio && npm run check:packaged && npm run archive:studio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-studio-${{ matrix.os }}
          path: |
            ${{ steps.package.outputs.archive-path }}
            ${{ steps.package.outputs.archive-path }}.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Save runtime for downstream checks
        shell: bash
        run: |
          mkdir -p temp
          tar -czf temp/runtime.tar.gz crates/vigo-runtime/vigo-routing-kernel.node target/release/vigo* public/vigo.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.os }}
          path: temp/runtime.tar.gz
          retention-days: 1
      - run: node test/check-city-portability.mjs --write temp/portable-city.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: city-${{ matrix.os }}
          path: temp/portable-city.zip
          retention-days: 1

  portability:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.os }}
          path: temp
      - run: tar -xzf temp/runtime.tar.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: city-*
          path: temp/foreign-cities
      - run: node test/check-city-portability.mjs --read temp/foreign-cities

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-documentation
          path: |
            docs/guide.html
            docs/standalone-openapi.json
          if-no-files-found: error

  attest:
    needs: [build, docs, deployment, portability, python-quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Stage immutable revision assets
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          python3 test/check-release-assets.py
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          fi
          python3 scripts/prepare-release-assets.py release verified-release --tag "$RELEASE_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: verified-release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: verified-release/*
          compression-level: 0
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: release
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "VIGO $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
      - name: Update release download links
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: python3 scripts/update-release-notes.py "$RELEASE_TAG" release
