name: Python package

on:
  push:
    branches: [main]
    tags: ['python-v*']
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-14
            python-version: "3.12"
          - os: windows-2022
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install mypy pytest ruff tqdm
      - name: Check code
        run: python -m ruff check vigo tests scripts examples
      - name: Check types
        run: python -m mypy vigo
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Check accelerated decoding
        run: |
          python -m pip install ".[speed]"
          python -m pytest -q
      - name: Check documentation
        run: python scripts/build-docs.py --check
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public source
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed wheel
        run: python scripts/check-wheel.py dist

  integration:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release engine identity and version
        if: github.ref_type == 'tag'
        env:
          ENGINE_REF: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release-engine.py --engine ..
      - run: python -m pip install ".[progress,speed]" pytest
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run build:rust-routing-kernel
        working-directory: .
      - run: npm run build:standalone
        working-directory: .
      - run: npm run build:cli
        working-directory: .
      - run: python scripts/prepare-runtime.py --engine ..
      - name: Prepare public fixture
        working-directory: .
        run: node python/scripts/prepare-integration.mjs
      - name: Build self-contained platform wheel
        env:
          VIGO_BUNDLE_RUNTIME: build/headless
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test headless engine including optional progress
        env:
          VIGO_RUNTIME: build/headless
        run: python -m pytest tests/test_live_runtime.py -q
      - name: Verify isolated wheel with no Node on PATH
        run: python scripts/check-wheel.py dist --require-bundled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [test, integration]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: python/dist
      - run: python -m twine check dist/*
      - name: Publish verified wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "VIGO Python $VERSION" --notes-file "docs/releases/$VERSION.md"
