name: Python checks

# Python wheels are built, verified and published by the Release workflow
# together with the engine. This workflow checks the package source.
on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-15
            python-version: "3.12"
          - os: windows-2022
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        # Pinned so a new linter release cannot fail an unchanged release.
        run: python -m pip install mypy==2.4.1 pytest ruff==0.17.4 tqdm
      - name: Check code
        run: python -m ruff check vigo tests scripts examples
      - name: Check types
        run: python -m mypy vigo
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Check accelerated decoding
        run: |
          python -m pip install ".[speed]"
          python -m pytest -q
      - name: Check documentation
        run: python scripts/build-docs.py --check
      - name: Check notebooks
        run: python scripts/check-notebooks.py
      - name: Check public source
        run: python scripts/check-public-release.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check installed wheel
        run: python scripts/check-wheel.py dist

