name: Native deployment verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: Engine container (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: runtime-${{ matrix.os }}
          path: temp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-rust-${{ matrix.os }}
          path: temp/rust
      - name: Restore verified runtime and licenses
        shell: bash
        run: |
          tar -xzf temp/runtime.tar.gz
          mkdir -p temp/container
          tar -xzf temp/rust/*.tar.gz -C temp/container --strip-components=1

      - run: docker build -f deploy/Dockerfile.release -t vigo-engine-check .
      - run: npm run check:deployment -- --image vigo-engine-check
