name: Native deployment verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: Engine container (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-${{ matrix.os }}
          path: temp
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rust-${{ matrix.os }}
          path: temp/rust
      - name: Restore verified runtime and licenses
        shell: bash
        run: |
          tar -xzf temp/runtime.tar.gz
          mkdir -p temp/container
          tar -xzf temp/rust/*.tar.gz -C temp/container --strip-components=1

      - run: docker build -f deploy/Dockerfile.release -t vigo-engine-check .
      - run: npm run check:deployment -- --image vigo-engine-check
