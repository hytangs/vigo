name: Native deployment verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: Engine container (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cli-runtime
      - run: docker build -f deploy/Dockerfile -t vigo-engine-check .
      - run: npm run check:deployment -- --image vigo-engine-check
