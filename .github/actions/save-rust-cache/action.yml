name: Save the Rust build cache
description: Save compiled Rust outputs right after compilation, so later failing checks still leave a warm cache.
runs:
  using: composite
  steps:
    - if: env.VIGO_RUST_CACHE_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ env.VIGO_RUST_CACHE_KEY }}
