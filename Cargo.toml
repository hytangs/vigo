[workspace]
resolver = "3"
members = ["crates/vigo-runtime", "crates/vigo-model", "crates/vigo-route", "crates/vigo-format", "crates/vigo-prepare", "crates/vigo-traffic", "crates/vigo-gtfs"]
exclude = ["vendor/cch"]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hytangs/vigo"
publish = false

[workspace.dependencies]
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = "symbols"
