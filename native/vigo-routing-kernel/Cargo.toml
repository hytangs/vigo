[package]
name = "vigo-routing-kernel"
version = "0.4.3"
edition = "2024"
publish = false
description = "Native timetable, street-routing, and accessibility kernel for VIGO."
license = "Apache-2.0"
repository = "https://github.com/hytangs/vigo"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive"]
standalone = ["dep:httparse", "dep:chrono", "dep:chrono-tz"]

[[bin]]
name = "vigo"
path = "src/bin/vigo.rs"
required-features = ["standalone"]

[dependencies]
bincode = "1.3"
cch = { path = "vendor/cch" }
memmap2 = "0.9"
napi = { version = "3", features = ["napi10"], optional = true }
napi-derive = { version = "3", optional = true }
rayon = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
httparse = { version = "1.10", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
chrono-tz = { version = "0.10", optional = true }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = "symbols"
