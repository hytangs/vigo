[package]
name = "vigo-routing-kernel"
version = "0.3.0"
edition = "2024"
publish = false
description = "Native timetable, street-routing, and accessibility kernel for VIGO."
license = "Apache-2.0"
repository = "https://github.com/hytangs/vigo"

[lib]
crate-type = ["cdylib"]

[dependencies]
bincode = "1.3"
cch = { path = "vendor/cch" }
memmap2 = "0.9"
napi = { version = "3", features = ["napi10"] }
napi-derive = "3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
strip = "symbols"
